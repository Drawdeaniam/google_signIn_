<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Kitchen Rumble</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <!-- Google Sign-In SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script>
        var unityInstance;

        // Global function to set Unity instance (accessible from both Unity and Google Sign-In)
        function setUnityInstance(instance) {
            unityInstance = instance;
            window.unityInstance = instance;
            console.log("✅ Unity instance set globally");
        }
    </script>
</head>
<body>
    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">Kitchen Rumble</div>
        </div>
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }

            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);

            if (type === 'error') {
                div.style = 'background: red; padding: 10px;';
            } else {
                if (type === 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(() => {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }

            updateBannerVisibility();
        }

        // Unity Build Configuration
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/ChefBet.loader.js";
        var config = {
            arguments: [],
            dataUrl: buildUrl + "/ChefBet.data.unityweb",
            frameworkUrl: buildUrl + "/ChefBet.framework.js.unityweb",
            codeUrl: buildUrl + "/ChefBet.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "GhoalVerse Games",
            productName: "Kitchen Rumble",
            productVersion: "1.0",
            showBanner: unityShowBanner,
            autoSyncPersistentDataPath: true,
        };

        // Mobile detection and responsive setup
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";

            // Set initial height to the visible viewport (accounts for browser chrome / WebView insets)
            var initialHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            container.style.height = initialHeight + 'px';
            canvas.style.height    = initialHeight + 'px';
        } else {
            canvas.style.width = "960px";
            canvas.style.height = "600px";
        }

        loadingBar.style.display = "block";

        // Load Unity
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((instance) => {
                loadingBar.style.display = "none";
                
                // Set Unity instance globally for both Google Sign-In and WebSocket
                setUnityInstance(instance);
                
                // Fullscreen button handler
                fullscreenButton.onclick = () => {
                    instance.SetFullscreen(1);
                };

                console.log("✅ Unity loaded successfully");
                console.log("✅ Google Sign-In SDK available");
                console.log("✅ WebSocket functionality ready (handled by C# + .jslib)");

                // Resize Unity canvas when the keyboard opens/closes in WebView
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', function () {
                        var vvHeight = window.visualViewport.height;
                        container.style.height = vvHeight + 'px';
                        canvas.style.height    = vvHeight + 'px';
                        console.log("📱 Viewport resized — canvas height adjusted to: " + vvHeight + "px");
                    });
                    console.log("✅ visualViewport keyboard listener registered");
                }

            }).catch((message) => {
                alert("Unity failed to load: " + message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
